<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Orbit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
  <link rel="stylesheet" href="estilos/laptop.css">
  <link rel="stylesheet" href="estilos/constructor.css">
  <link rel="stylesheet" href="estilos/cohetes.css">
  <link rel="stylesheet" href="estilos/manual.css">
  <link rel="stylesheet" href="estilos/control.css">
  <link rel="stylesheet" href="estilos/pantallas3d.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
      "mqtt": "https://cdn.jsdelivr.net/npm/mqtt@5.16.1/dist/mqtt.esm.js"
    }
  }
  </script>
</head>
<body>
  <div id="lienzo"></div>

  <!-- Pantalla de inicio -->
  <section id="inicio" class="cartel">
    <svg class="icono-orbita" viewBox="0 0 120 50" aria-hidden="true">
      <ellipse cx="55" cy="28" rx="48" ry="16" transform="rotate(-14 55 28)" />
      <circle cx="44" cy="33" r="6" class="relleno" />
      <path d="M92 6 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5z" class="relleno" />
    </svg>
    <h1 id="titulo" class="titulo"></h1>
    <p id="lema" class="lema"></p>
    <button id="btn-unirse" class="btn btn-primario" type="button"><span class="triangulo">▶</span><span id="txt-unirse"></span></button>
    <button id="btn-ajustes" class="btn btn-secundario" type="button"></button>
    <div class="pie">
      <span class="raya"></span>
      <svg class="icono-mini" viewBox="0 0 60 30" aria-hidden="true">
        <ellipse cx="28" cy="17" rx="22" ry="8" transform="rotate(-18 28 17)" />
        <circle cx="22" cy="20" r="4" class="relleno" />
        <path d="M46 3 l1.5 3.5 3.5 1.5 -3.5 1.5 -1.5 3.5 -1.5 -3.5 -3.5 -1.5 3.5 -1.5z" class="relleno" />
      </svg>
      <span class="raya"></span>
    </div>
    <p id="jugadores" class="jugadores"></p>
  </section>

  <!-- Unirse -->
  <dialog id="dlg-unirse" class="dialogo">
    <form method="dialog" id="form-unirse">
      <h2 data-t="unirseTitulo">Unirse a la tripulación</h2>
      <label><span data-t="nick">Nick</span>
        <input id="in-nick" name="nick" maxlength="16" required autocomplete="nickname" placeholder="Ej.: Astro" data-t-ph="nickEj">
      </label>
      <label><span data-t="codigoSala">Código de sala</span>
        <input id="in-sala" name="sala" maxlength="8" required pattern="[A-Za-z0-9]{4,8}" autocomplete="off">
      </label>
      <p class="tenue pequeno" data-t="comparte">Comparte el mismo código con tu equipo para entrar en la misma sala.</p>
      <div class="acciones">
        <button type="button" class="btn-plano" id="cancelar-unirse" data-t="cancelar">Cancelar</button>
        <button type="submit" class="btn-plano primario" data-t="entrar">Entrar</button>
      </div>
    </form>
  </dialog>

  <!-- Ajustes -->
  <dialog id="dlg-ajustes" class="dialogo">
    <form method="dialog">
      <h2 data-t="ajustesTitulo">Ajustes</h2>
      <label><span data-t="sensibilidad">Sensibilidad de la cámara</span>
        <input id="in-sensibilidad" type="range" min="0.002" max="0.012" step="0.001">
      </label>
      <label><span data-t="calidad">Calidad gráfica</span>
        <select id="in-calidad">
          <option value="alta" data-t="calidadAlta">Alta</option>
          <option value="baja" data-t="calidadBaja">Baja (equipos lentos)</option>
        </select>
      </label>
      <label class="fila"><input id="in-animar" type="checkbox"> <span data-t="animar">Animar el fondo del inicio</span></label>
      <label><span data-t="idioma">Idioma / Language</span>
        <select id="in-idioma">
          <option value="es">Español</option>
          <option value="en">English</option>
        </select>
      </label>
      <div class="acciones"><button class="btn-plano primario" data-t="listo">Listo</button></div>
    </form>
  </dialog>

  <!-- Lobby -->
  <section id="lobby" class="panel oculto">
    <header class="lobby-cabecera">
      <div>
        <p class="tenue pequeno" data-t="sala">SALA</p>
        <p class="codigo"><strong id="codigo-sala"></strong> <button id="copiar" class="btn-plano" type="button" data-t="copiar">Copiar enlace</button></p>
      </div>
      <p id="contador" class="contador"></p>
    </header>
    <h3 data-t="tripulacionTitulo">Tripulación</h3>
    <ul id="tripulacion" class="tripulacion"></ul>
    <h3 data-t="tuRolTitulo">Tu rol</h3>
    <div id="roles" class="roles"></div>
    <p id="aviso" class="aviso"></p>
    <div class="acciones">
      <button id="salir-lobby" class="btn-plano" type="button" data-t="salir">Salir</button>
      <button id="iniciar" class="btn-plano primario" type="button">Iniciar misión</button>
    </div>
  </section>

  <!-- Pantallas de juego (src/pantallas/): franja superior, pantalla de la fase y modal de eventos -->
  <!-- #pantalla se proyecta sobre el portátil 3D o sobre la pared de la sala de control (main.js la coloca y escala) -->
  <header id="franja" class="oculto"></header>
  <main id="pantalla" class="pantalla oculto"></main>
  <div id="capa" class="oculto"></div>
  <div id="modal-evento" class="oculto"></div>
  <!-- Elección de escenario en el proyector (main.js): indicación y confirmación -->
  <div id="proyector-ui" class="oculto">
    <p id="proyector-txt"></p>
    <button id="confirmar-escenario" class="btn-plano primario" type="button" disabled></button>
  </div>
  <div id="fundido" aria-hidden="true"></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
